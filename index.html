<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#03050c" />
<meta name="description" content="GSM Solution builds Order Management, Inventory Management, Attendance, Quotation and GST Billing software." />
<title>GSM Solution — Custom Software Development</title>

<style>
  /* ============================================================
     RESET
  ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cyan:   #22d3ee;
    --blue:   #3b82f6;
    --violet: #8b5cf6;
    --text:   #e2ecff;
    --muted:  #8ea6d4;
    --line:   rgba(94,140,220,.30);
    --bg:     #03050c;
    --pad:    clamp(12px, 1.6vw, 24px);
  }

  html {
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    height: 100%;
  }

  body {
    font-family: Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;

    /* lock to viewport — no page scroll, the stage owns the screen */
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    padding: var(--pad);
  }

  /* hidden defs holder */
  .svg-defs {
    position: absolute;
    width: 0; height: 0;
    overflow: hidden;
    pointer-events: none;
  }

  /* ============================================================
     THE BLUE BOX  —  always fits the screen
  ============================================================ */
  .stage {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    border-radius: clamp(18px, 2.2vw, 32px);
    overflow: hidden;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    padding: clamp(16px, 2.2vw, 38px);
    padding-top:    max(clamp(16px, 2.2vw, 38px), env(safe-area-inset-top));
    padding-bottom: max(clamp(16px, 2.2vw, 38px), env(safe-area-inset-bottom));
    padding-left:   max(clamp(16px, 2.2vw, 38px), env(safe-area-inset-left));
    padding-right:  max(clamp(16px, 2.2vw, 38px), env(safe-area-inset-right));

    background:
      radial-gradient(120% 100% at 12% 0%,   rgba(37,99,235,.28) 0%, transparent 55%),
      radial-gradient(110% 110% at 100% 100%, rgba(124,58,237,.26) 0%, transparent 58%),
      radial-gradient(90% 90% at 78% 6%,     rgba(6,182,212,.20) 0%, transparent 60%),
      linear-gradient(165deg, #060a16 0%, #0a1124 45%, #04070f 100%);

    border: 1px solid rgba(59,130,246,.20);
    box-shadow:
      0 40px 120px -50px rgba(34,211,238,.35),
      0 0 0 1px rgba(255,255,255,.02) inset,
      0 1px 0 rgba(255,255,255,.05) inset;
  }

  /* grid overlay */
  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(59,91,169,.22) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,91,169,.22) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(ellipse 78% 78% at 50% 50%, #000 0%, transparent 78%);
            mask-image: radial-gradient(ellipse 78% 78% at 50% 50%, #000 0%, transparent 78%);
  }

  /* drifting glow blobs */
  .blob {
    position: absolute;
    z-index: 0;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
    will-change: transform;
  }
  .blob-a { width: 46vmin; height: 46vmin; left: -8vmin;  top: -8vmin;  background: radial-gradient(circle, rgba(37,99,235,.55), transparent 68%);  animation: drift  24s ease-in-out infinite; }
  .blob-b { width: 52vmin; height: 52vmin; right: -12vmin; top: -14vmin; background: radial-gradient(circle, rgba(124,58,237,.48), transparent 68%); animation: drift2 30s ease-in-out infinite; }
  .blob-c { width: 48vmin; height: 48vmin; right: 6vmin;  bottom: -18vmin; background: radial-gradient(circle, rgba(6,182,212,.42), transparent 68%); animation: drift3 27s ease-in-out infinite; }

  @keyframes drift  { 0%,100%{transform:translate(0,0) scale(1);}     50%{transform:translate(6vmin,-4vmin) scale(1.08);} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1);}     50%{transform:translate(-7vmin,4vmin) scale(1.06);} }
  @keyframes drift3 { 0%,100%{transform:translate(0,0) scale(1);}     50%{transform:translate(4vmin,5vmin) scale(1.1);} }

  /* ---------- stage rows ---------- */
  .stage > * { position: relative; z-index: 1; }

  .stage-top {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 8px 16px 8px 12px;
    font-size: clamp(10.5px, 1.05vw, 12.5px);
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #a9c4ee;
    background: rgba(13,23,48,.7);
    border: 1px solid rgba(59,130,246,.3);
    border-radius: 999px;
    -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
    white-space: nowrap;
  }
  .badge .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
    animation: pulseDot 2.4s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%,100% { opacity: 1;  transform: scale(1); }
    50%     { opacity: .45; transform: scale(.72); }
  }

  /* ---------- logo area: takes all leftover space, never overflows ---------- */
  .stage-logo {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    margin: clamp(6px, 1.2vh, 18px) 0;
  }
  .stage-logo svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .logo-tall { display: none; }

  /* ---------- CTA row ---------- */
  .stage-cta {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 1.2vh, 14px);
  }

  .cta-note {
    font-size: clamp(11px, 1.05vw, 13px);
    color: #6f86b3;
    letter-spacing: .02em;
    text-align: center;
  }

  /* ============================================================
     REQUEST DEMO BUTTON
  ============================================================ */
  .btn-demo {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    padding: clamp(14px, 1.5vh, 17px) clamp(30px, 4vw, 46px);
    font-family: inherit;
    font-size: clamp(15px, 1.25vw, 17px);
    font-weight: 700;
    letter-spacing: .3px;
    color: #04121f;
    background: linear-gradient(135deg, var(--cyan), var(--blue) 55%, var(--violet));
    border: none;
    border-radius: 999px;
    cursor: pointer;
    overflow: hidden;
    isolation: isolate;
    touch-action: manipulation;
    min-height: 52px;
    box-shadow:
      0 0 0 1px rgba(34,211,238,.35),
      0 16px 40px -14px rgba(59,130,246,.95);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
  }
  .btn-demo:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 0 1px rgba(34,211,238,.7), 0 22px 52px -14px rgba(59,130,246,1);
  }
  .btn-demo:active { transform: translateY(-1px) scale(.99); }
  .btn-demo:focus-visible { outline: 3px solid #a5f3fc; outline-offset: 4px; }

  .btn-demo::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background: linear-gradient(115deg, transparent 32%, rgba(255,255,255,.75) 50%, transparent 68%);
    transform: translateX(-130%);
    animation: sweep 3.6s ease-in-out infinite;
  }
  @keyframes sweep { 0%{transform:translateX(-130%);} 55%,100%{transform:translateX(130%);} }

  .btn-demo::before {
    content: "";
    position: absolute; inset: -3px;
    border-radius: inherit;
    pointer-events: none;
    animation: halo 2.8s ease-out infinite;
  }
  @keyframes halo {
    0%   { box-shadow: 0 0 0 0 rgba(34,211,238,.5); }
    70%  { box-shadow: 0 0 0 20px rgba(34,211,238,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,211,238,0); }
  }

  .btn-demo svg { width: 19px; height: 19px; position: relative; z-index: 1; }
  .btn-demo span { position: relative; z-index: 1; }

  /* ============================================================
     MODAL — also fits the screen
  ============================================================ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: grid;
    place-items: center;
    padding: clamp(10px, 1.8vw, 26px);
    background: rgba(3,5,12,.82);
    -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease, visibility .3s ease;
    overflow: hidden;
  }
  .modal-overlay.open { opacity: 1; visibility: visible; }

  .modal {
    position: relative;
    width: 100%;
    max-width: 940px;
    max-height: calc(100dvh - clamp(20px, 3.6vw, 52px));
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: clamp(24px, 2.8vw, 40px);
    border-radius: clamp(16px, 1.6vw, 24px);
    border: 1px solid rgba(59,130,246,.30);
    background:
      radial-gradient(120% 100% at 0% 0%,   rgba(37,99,235,.22) 0%, transparent 55%),
      radial-gradient(110% 110% at 100% 100%, rgba(124,58,237,.20) 0%, transparent 58%),
      linear-gradient(165deg, #0c1429 0%, #070b18 100%);
    box-shadow:
      0 60px 120px -40px rgba(0,0,0,.95),
      0 0 0 1px rgba(255,255,255,.03) inset;
    transform: translateY(26px) scale(.975);
    opacity: 0;
    transition: transform .38s cubic-bezier(.2,.8,.2,1), opacity .38s ease;
  }
  .modal-overlay.open .modal { transform: translateY(0) scale(1); opacity: 1; }

  /* accent line */
  .modal::before {
    content: "";
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--blue), var(--violet), transparent);
  }

  /* subtle grid inside modal */
  .modal::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(59,91,169,.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,91,169,.16) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 0%, transparent 75%);
            mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 0%, transparent 75%);
    opacity: .7;
  }
  .modal > * { position: relative; z-index: 1; }

  .modal-close {
    position: absolute;
    top: clamp(12px, 1.4vw, 18px);
    right: clamp(12px, 1.4vw, 18px);
    z-index: 3;
    width: 42px; height: 42px;
    display: grid;
    place-items: center;
    font-size: 24px;
    line-height: 1;
    color: var(--muted);
    background: rgba(255,255,255,.05);
    border: 1px solid var(--line);
    border-radius: 50%;
    cursor: pointer;
    touch-action: manipulation;
    transition: background .2s, color .2s, transform .2s;
  }
  .modal-close:hover {
    background: rgba(248,113,113,.14);
    color: #fca5a5;
    transform: rotate(90deg);
  }

  .modal-head { margin-bottom: clamp(16px, 2vh, 24px); padding-right: 46px; }

  .modal h2 {
    font-size: clamp(21px, 2.1vw, 27px);
    font-weight: 800;
    letter-spacing: -.3px;
    line-height: 1.15;
    background: linear-gradient(120deg, #ffffff, #9fc0ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .modal .sub {
    margin-top: 7px;
    font-size: clamp(13px, 1.1vw, 14.5px);
    line-height: 1.55;
    color: var(--muted);
  }

  /* ============================================================
     FORM
  ============================================================ */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(12px, 1.3vw, 18px);
  }
  .field { display: flex; flex-direction: column; }
  .field.full { grid-column: 1 / -1; }

  .field label {
    margin-bottom: 6px;
    font-size: clamp(11.5px, .95vw, 13px);
    font-weight: 600;
    letter-spacing: .3px;
    color: #b8cbe8;
  }
  .req { color: var(--cyan); }

  .field input,
  .field select,
  .field textarea {
    width: 100%;
    padding: clamp(11px, 1.2vh, 14px) 15px;
    font-family: inherit;
    font-size: 16px;
    color: #e8f1ff;
    background: #0d1730;
    border: 1px solid var(--line);
    border-radius: 11px;
    outline: none;
    -webkit-appearance: none;
            appearance: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .field input::placeholder,
  .field textarea::placeholder { color: #5d7099; }

  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    border-color: var(--cyan);
    background: #101d3c;
    box-shadow: 0 0 0 3px rgba(34,211,238,.16);
  }
  .field input:user-invalid,
  .field select:user-invalid,
  .field textarea:user-invalid {
    border-color: rgba(248,113,113,.7);
    box-shadow: 0 0 0 3px rgba(248,113,113,.13);
  }

  .field select {
    padding-right: 44px;
    cursor: pointer;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322d3ee' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 15px center;
    background-size: 15px;
  }
  .field select option { background: #0b1226; color: #e2ecff; }

  .field textarea { resize: none; min-height: 76px; line-height: 1.5; }

  #otherWrap { display: none; }
  #otherWrap.show { display: flex; animation: fadeSlide .3s ease both; }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .form-actions { margin-top: clamp(14px, 1.8vh, 22px); }

  .btn-submit {
    width: 100%;
    padding: clamp(13px, 1.5vh, 16px);
    font-family: inherit;
    font-size: clamp(15px, 1.2vw, 16px);
    font-weight: 700;
    letter-spacing: .3px;
    color: #04121f;
    background: linear-gradient(135deg, var(--cyan), var(--blue) 55%, var(--violet));
    border: none;
    border-radius: 12px;
    cursor: pointer;
    touch-action: manipulation;
    min-height: 52px;
    box-shadow: 0 16px 38px -14px rgba(59,130,246,.95);
    transition: transform .2s, box-shadow .2s, opacity .2s;
  }
  .btn-submit:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 20px 46px -14px rgba(59,130,246,1);
  }
  .btn-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  .form-status { margin-top: 14px; font-size: 14px; line-height: 1.5; }
  .form-status.success {
    padding: 12px 15px;
    background: rgba(34,197,94,.12);
    border: 1px solid rgba(34,197,94,.42);
    border-radius: 10px;
    color: #86efac;
  }
  .form-status.error {
    padding: 12px 15px;
    background: rgba(248,113,113,.12);
    border: 1px solid rgba(248,113,113,.42);
    border-radius: 10px;
    color: #fca5a5;
  }

  .form-note {
    margin-top: 12px;
    font-size: 12.5px;
    color: #5d7099;
    text-align: center;
  }

  /* ============================================================
     RESPONSIVE
  ============================================================ */

  /* ---------- PHONES, PORTRAIT: true full-bleed ---------- */
  @media (max-width: 860px) and (orientation: portrait) {
    body { padding: 0; }
    .stage {
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-top: none;
      border-bottom: none;
      padding-left:   max(clamp(16px, 5vw, 26px), env(safe-area-inset-left));
      padding-right:  max(clamp(16px, 5vw, 26px), env(safe-area-inset-right));
      padding-top:    max(18px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    /* swap to the tall logo */
    .logo-wide { display: none; }
    .logo-tall { display: block; }

    /* full-screen sheet modal */
    .modal-overlay { padding: 0; place-items: stretch; }
    .modal {
      max-width: none;
      max-height: 100dvh;
      min-height: 100dvh;
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-bottom: none;
      padding: max(26px, env(safe-area-inset-top)) 20px max(26px, env(safe-area-inset-bottom));
      transform: translateY(40px);
    }
    .form-grid { grid-template-columns: 1fr; }
  }

  /* ---------- PHONES, LANDSCAPE ---------- */
  @media (max-width: 860px) and (orientation: landscape) {
    .stage { padding: 14px 20px; }
    .badge { padding: 6px 13px 6px 10px; font-size: 10px; }
    .btn-demo { min-height: 46px; padding: 12px 28px; font-size: 14.5px; }
    .cta-note { display: none; }
    .stage-logo { margin: 4px 0; }

    .modal { max-height: calc(100dvh - 20px); padding: 24px 26px; }
    .modal h2 { font-size: 20px; }
    .form-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .field label { font-size: 11px; margin-bottom: 4px; }
    .field input, .field select { padding: 10px 13px; }
    .field textarea { min-height: 56px; }
  }

  /* ---------- SHORT SCREENS ---------- */
  @media (max-height: 520px) {
    .badge { display: none; }
    .cta-note { display: none; }
    .btn-demo { min-height: 44px; padding: 11px 26px; font-size: 14px; }
  }
  @media (max-height: 640px) and (orientation: portrait) {
    .badge { padding: 6px 13px 6px 10px; font-size: 10px; }
  }

  /* ============================================================
     SVG ANIMATIONS
  ============================================================ */
  @keyframes spin     { to { transform: rotate(360deg); } }
  @keyframes spinRev  { to { transform: rotate(-360deg); } }
  @keyframes fadeIn   { from { opacity: 0; } to { opacity: 1; } }
  @keyframes riseIn   { from { opacity:0; transform: translateY(20px);} to { opacity:1; transform: translateY(0);} }
  @keyframes drawG    { from { stroke-dashoffset: 300; } to { stroke-dashoffset: 0; } }
  @keyframes travel   { 0%{stroke-dashoffset:300;opacity:0;} 8%{opacity:.95;} 88%{opacity:.95;} 100%{stroke-dashoffset:0;opacity:0;} }
  @keyframes growX    { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .logo { --ox: 270px; --oy: 170px; }          /* wide emblem centre */
  .logo-tall { --ox: 380px; --oy: 280px; }     /* tall emblem centre */

  .emblem { animation: fadeIn 1s ease both; }

  .ring-a, .ring-b, .orbit {
    transform-box: view-box;
    transform-origin: var(--ox) var(--oy);
  }
  .ring-a { animation: spin 28s linear infinite; }
  .ring-b { animation: spinRev 20s linear infinite; }
  .orbit  { animation: spin 9s linear infinite; }

  .gmark  { stroke-dasharray: 300; animation: drawG 1.6s cubic-bezier(.2,.8,.2,1) .25s both; }
  .gpulse { stroke-dasharray: 50 250; opacity: 0; animation: travel 3.6s linear 2.2s infinite; }

  .rise-1 { animation: riseIn .9s cubic-bezier(.2,.8,.2,1) .45s both; }
  .rise-2 { animation: riseIn .9s cubic-bezier(.2,.8,.2,1) .60s both; }
  .rise-3 { animation: riseIn .9s cubic-bezier(.2,.8,.2,1) .75s both; }

  .rule {
    transform-box: fill-box;
    transform-origin: left center;
    animation: growX .85s cubic-bezier(.2,.8,.2,1) 1s both;
  }
  .rule-c { transform-origin: center; }

  @media (prefers-reduced-motion: reduce) {
    .blob, .ring-a, .ring-b, .orbit, .gmark, .gpulse,
    .rise-1, .rise-2, .rise-3, .rule, .emblem,
    .btn-demo::before, .btn-demo::after, .badge .dot { animation: none !important; }
    .gpulse { opacity: 0 !important; }
  }
</style>
</head>

<body>

<!-- ============================================================
     SHARED SVG DEFS (referenced by both logo variants)
============================================================ -->
<svg class="svg-defs" aria-hidden="true" focusable="false" width="0" height="0">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#3b82f6"/>
      <stop offset="0.45" stop-color="#22d3ee"/>
      <stop offset="1"    stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#e2ecff"/>
      <stop offset="1"    stop-color="#9fc0ff"/>
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1"   stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="coreGlow">
      <stop offset="0"   stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#3b82f6" stop-opacity="0.09"/>
      <stop offset="1"   stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>

  </defs>

<!-- ============================================================
     JAVASCRIPT
============================================================ -->
<script>
(function () {
  "use strict";

  const overlay   = document.getElementById("modalOverlay");
  const openBtn   = document.getElementById("demoBtn");
  const closeBtn  = document.getElementById("modalClose");
  const form      = document.getElementById("demoForm");
  const statusBox = document.getElementById("formStatus");
  const submitBtn = document.getElementById("submitBtn");
  const category  = document.getElementById("category");
  const otherWrap = document.getElementById("otherWrap");
  const otherText = document.getElementById("otherDetails");

  let lastFocused = null;

  /* ---------- open / close ---------- */
  function openModal() {
    lastFocused = document.activeElement;
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    setTimeout(function () {
      const first = document.getElementById("name");
      if (first) first.focus({ preventScroll: true });
    }, 150);
  }

  function closeModal() {
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    if (lastFocused) lastFocused.focus();
  }

  openBtn.addEventListener("click", openModal);
  closeBtn.addEventListener("click", closeModal);

  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) closeModal();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && overlay.classList.contains("open")) closeModal();
  });

  /* focus trap */
  overlay.addEventListener("keydown", function (e) {
    if (e.key !== "Tab") return;
    const nodes = overlay.querySelectorAll(
      'button, input:not([type="hidden"]), select, textarea, [href], [tabindex]:not([tabindex="-1"])'
    );
    const list = Array.prototype.filter.call(nodes, function (el) {
      return el.offsetParent !== null && !el.disabled;
    });
    if (!list.length) return;

    const first = list[0];
    const last  = list[list.length - 1];

    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  });

  /* ---------- "Other" conditional ---------- */
  category.addEventListener("change", function () {
    const isOther = category.value === "Other";
    otherWrap.classList.toggle("show", isOther);
    otherText.required = isOther;
    if (isOther) setTimeout(function(){ otherText.focus(); }, 120);
    else otherText.value = "";
  });

  /* ---------- submit ---------- */
  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    if (!form.checkValidity()) { form.reportValidity(); return; }

    const keyField = form.querySelector('input[name="access_key"]');
    if (!keyField.value || keyField.value.length < 10) {
      statusBox.className = "form-status error";
      statusBox.textContent = "⚠️ Setup incomplete: Web3Forms access key is missing or invalid.";
      return;
    }

    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";
    statusBox.className = "form-status";
    statusBox.textContent = "";

    try {
      const response = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { Accept: "application/json" },
        body: new FormData(form)
      });

      const data = await response.json();

      if (response.ok && data.success) {
        form.reset();
        otherWrap.classList.remove("show");
        otherText.required = false;

        statusBox.className = "form-status success";
        statusBox.textContent = "✅ Thank you! Your demo request has been sent. We'll contact you within 24 hours.";

        setTimeout(closeModal, 4000);
      } else {
        throw new Error(data.message || "Submission failed.");
      }
    } catch (err) {
      statusBox.className = "form-status error";
      statusBox.textContent =
        "❌ " + (err.message || "Something went wrong.") +
        " Please try again, or email us at gsmmargao@gmail.com.";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = originalText;
    }
  });
})();
</script>
