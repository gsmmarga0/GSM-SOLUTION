<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#03050c" />
<meta name="description" content="GSM Solution builds Order Management, Inventory Management, Attendance, Quotation and GST Billing software." />
<title>GSM Solution — Custom Software Development</title>

<style>
  /* ============================================================
     BASE RESET
  ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cyan:   #22d3ee;
    --blue:   #3b82f6;
    --violet: #8b5cf6;
    --text:   #e2ecff;
    --muted:  #8ea6d4;
    --line:   rgba(94,140,220,.28);
    --bg:     #03050c;
  }

  html {
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh; /* dynamic viewport height for mobile */
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ============================================================
     RESPONSIVE PAGE LAYOUT
     — Phones (portrait): full-screen vertical
     — Desktops (landscape): centered horizontal
  ============================================================ */
  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 28px 16px 40px;
    width: 100%;
  }

  /* Logo container — fluid width */
  .logo-wrap {
    width: 100%;
    max-width: 1200px;
  }
  .logo-wrap svg {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ============================================================
     REQUEST DEMO BUTTON
  ============================================================ */
  .btn-demo {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    padding: 17px 40px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .4px;
    color: #04121f;
    background: linear-gradient(135deg, var(--cyan), var(--blue) 55%, var(--violet));
    border: none;
    border-radius: 999px;
    cursor: pointer;
    overflow: hidden;
    isolation: isolate;
    box-shadow:
      0 0 0 1px rgba(34,211,238,.35),
      0 14px 38px -10px rgba(59,130,246,.85);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
    touch-action: manipulation; /* faster tap on mobile */
    min-height: 54px; /* comfortable tap target */
  }
  .btn-demo:hover {
    transform: translateY(-3px);
    box-shadow:
      0 0 0 1px rgba(34,211,238,.65),
      0 20px 48px -10px rgba(59,130,246,1);
  }
  .btn-demo:active { transform: translateY(-1px) scale(.99); }
  .btn-demo:focus-visible { outline: 3px solid #a5f3fc; outline-offset: 4px; }

  /* shimmer sweep */
  .btn-demo::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(115deg,
      transparent 32%,
      rgba(255,255,255,.7) 50%,
      transparent 68%);
    transform: translateX(-130%);
    animation: sweep 3.4s ease-in-out infinite;
  }
  @keyframes sweep {
    0%        { transform: translateX(-130%); }
    55%, 100% { transform: translateX(130%); }
  }

  /* pulsing halo */
  .btn-demo::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: inherit;
    pointer-events: none;
    box-shadow: 0 0 0 0 rgba(34,211,238,.55);
    animation: halo 2.6s ease-out infinite;
  }
  @keyframes halo {
    0%   { box-shadow: 0 0 0 0 rgba(34,211,238,.5); }
    70%  { box-shadow: 0 0 0 18px rgba(34,211,238,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,211,238,0); }
  }

  .btn-demo svg { width: 19px; height: 19px; position: relative; z-index: 1; }
  .btn-demo span { position: relative; z-index: 1; }

  /* ============================================================
     MODAL — full-screen on phones, centered card on desktop
  ============================================================ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: rgba(3,5,12,.85);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    opacity: 0;
    visibility: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    transition: opacity .3s ease, visibility .3s ease;
    /* safe-area for notched phones */
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .modal-overlay.open { opacity: 1; visibility: visible; }

  .modal {
    position: relative;
    width: 100%;
    max-width: 720px;
    max-height: 100dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 38px 24px 32px;
    background: linear-gradient(160deg, #0c1429 0%, #070b18 100%);
    border: 1px solid rgba(59,130,246,.3);
    border-radius: 0;
    box-shadow: 0 50px 100px -35px rgba(0,0,0,.95);
    transform: translateY(30px);
    opacity: 0;
    transition: transform .38s cubic-bezier(.2,.8,.2,1), opacity .38s ease;
  }
  .modal-overlay.open .modal { transform: translateY(0); opacity: 1; }

  /* top accent line */
  .modal::before {
    content: "";
    position: absolute;
    top: 0; left: 12%; right: 12%;
    height: 2px;
    border-radius: 0 0 4px 4px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--blue), var(--violet), transparent);
  }

  .modal-close {
    position: absolute;
    top: 14px; right: 14px;
    width: 42px; height: 42px;
    display: grid;
    place-items: center;
    font-size: 24px;
    line-height: 1;
    color: var(--muted);
    background: rgba(255,255,255,.05);
    border: 1px solid var(--line);
    border-radius: 50%;
    cursor: pointer;
    transition: background .2s, color .2s, transform .2s;
    touch-action: manipulation;
  }
  .modal-close:hover {
    background: rgba(248,113,113,.14);
    color: #fca5a5;
    transform: rotate(90deg);
  }

  .modal h2 {
    margin: 0 0 8px;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -.3px;
    background: linear-gradient(120deg, #ffffff, #9fc0ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .modal .sub {
    margin: 0 0 24px;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--muted);
  }

  /* ============================================================
     FORM
  ============================================================ */
  .field-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
  }

  .field { margin-bottom: 17px; }

  .field label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .3px;
    color: #b8cbe8;
  }
  .req { color: var(--cyan); }

  .field input,
  .field select,
  .field textarea {
    width: 100%;
    padding: 14px 15px;
    font-family: inherit;
    font-size: 16px; /* 16px prevents iOS zoom on focus */
    color: #e8f1ff;
    background: #0d1730;
    border: 1px solid var(--line);
    border-radius: 11px;
    outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
    -webkit-appearance: none;
    appearance: none;
  }
  .field input::placeholder,
  .field textarea::placeholder { color: #5d7099; }

  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    border-color: var(--cyan);
    background: #101d3c;
    box-shadow: 0 0 0 3px rgba(34,211,238,.16);
  }

  .field input:user-invalid,
  .field select:user-invalid,
  .field textarea:user-invalid {
    border-color: rgba(248,113,113,.7);
    box-shadow: 0 0 0 3px rgba(248,113,113,.13);
  }

  .field select {
    padding-right: 44px;
    cursor: pointer;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322d3ee' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 15px center;
    background-size: 15px;
  }
  .field select option { background: #0b1226; color: #e2ecff; }

  .field textarea { resize: vertical; min-height: 90px; line-height: 1.55; }

  #otherWrap { display: none; }
  #otherWrap.show { display: block; animation: fadeSlide .32s ease both; }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* submit */
  .btn-submit {
    width: 100%;
    margin-top: 6px;
    padding: 16px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .4px;
    color: #04121f;
    background: linear-gradient(135deg, var(--cyan), var(--blue) 55%, var(--violet));
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 14px 34px -12px rgba(59,130,246,.9);
    transition: transform .2s, box-shadow .2s, opacity .2s;
    touch-action: manipulation;
    min-height: 54px;
  }
  .btn-submit:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 18px 42px -12px rgba(59,130,246,1);
  }
  .btn-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  .form-status { margin-top: 16px; font-size: 14.5px; line-height: 1.55; }
  .form-status.success {
    padding: 13px 16px;
    background: rgba(34,197,94,.12);
    border: 1px solid rgba(34,197,94,.42);
    border-radius: 10px;
    color: #86efac;
  }
  .form-status.error {
    padding: 13px 16px;
    background: rgba(248,113,113,.12);
    border: 1px solid rgba(248,113,113,.42);
    border-radius: 10px;
    color: #fca5a5;
  }

  .form-note {
    margin-top: 14px;
    font-size: 12.5px;
    color: #5d7099;
    text-align: center;
  }

  /* ============================================================
     RESPONSIVE BREAKPOINTS
  ============================================================ */

  /* ---------- PHONES: portrait ---------- */
  @media (max-width: 767px) and (orientation: portrait) {
    .page {
      gap: 24px;
      padding: 20px 14px 36px;
      justify-content: center;
    }
    .modal {
      /* full-screen takeover */
      max-width: 100%;
      max-height: 100dvh;
      border-radius: 0;
      padding: 30px 18px 28px;
      border-left: none;
      border-right: none;
      min-height: 100dvh;
    }
    .modal-overlay {
      align-items: flex-start;
    }
  }

  /* ---------- PHONES: landscape ---------- */
  @media (max-width: 767px) and (orientation: landscape) {
    .page {
      gap: 16px;
      padding: 16px 24px;
      justify-content: center;
    }
    .logo-wrap { max-width: 680px; }
    .modal {
      max-width: 90vw;
      max-height: 92dvh;
      border-radius: 16px;
      padding: 28px 28px 24px;
      min-height: auto;
    }
    .modal-overlay { align-items: center; }
    .field-row { grid-template-columns: 1fr 1fr; gap: 14px; }
    .field-row .field { margin-bottom: 17px; }
  }

  /* ---------- TABLETS & DESKTOP: landscape ---------- */
  @media (min-width: 768px) {
    .page {
      gap: 36px;
      padding: 40px 24px 56px;
      justify-content: center;
    }
    .logo-wrap { max-width: 1200px; }
    .modal {
      max-width: 720px;
      border-radius: 22px;
      padding: 40px 36px 34px;
      max-height: 92vh;
      min-height: auto;
    }
    .modal-overlay { align-items: center; }
    /* two-column rows on desktop */
    .field-row {
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
  }

  /* ---------- LARGE DESKTOP ---------- */
  @media (min-width: 1200px) {
    .page { gap: 44px; }
    .modal { max-width: 740px; }
  }

  /* ---------- SHORT LANDSCAPE (phone rotated) ---------- */
  @media (max-height: 500px) and (orientation: landscape) {
    .page { gap: 10px; padding: 10px 16px; }
    .logo-wrap { max-width: 520px; }
    .btn-demo { padding: 13px 30px; font-size: 15px; min-height: 46px; }
    .modal { padding: 22px 20px 18px; }
    .modal h2 { font-size: 21px; }
    .modal .sub { font-size: 13px; margin-bottom: 16px; }
    .field { margin-bottom: 12px; }
    .field input, .field select { padding: 11px 13px; }
    .btn-submit { padding: 13px; font-size: 15px; min-height: 46px; }
  }

  /* ============================================================
     SVG ANIMATIONS
  ============================================================ */
  @keyframes spin     { to { transform: rotate(360deg); } }
  @keyframes spinRev  { to { transform: rotate(-360deg); } }
  @keyframes fadeIn   { from { opacity: 0; } to { opacity: 1; } }
  @keyframes riseIn   { from { opacity:0; transform: translateY(22px);} to { opacity:1; transform: translateY(0);} }
  @keyframes drawG    { from { stroke-dashoffset: 280; } to { stroke-dashoffset: 0; } }
  @keyframes travel   { 0%{stroke-dashoffset:280;opacity:0;} 8%{opacity:.95;} 88%{opacity:.95;} 100%{stroke-dashoffset:0;opacity:0;} }
  @keyframes growX    { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes drift    { 0%,100%{transform:translate(0,0);} 50%{transform:translate(34px,-26px);} }
  @keyframes drift2   { 0%,100%{transform:translate(0,0);} 50%{transform:translate(-40px,22px);} }
  @keyframes drift3   { 0%,100%{transform:translate(0,0);} 50%{transform:translate(26px,30px);} }

  .blob-a { animation: drift  22s ease-in-out infinite; }
  .blob-b { animation: drift2 28s ease-in-out infinite; }
  .blob-c { animation: drift3 25s ease-in-out infinite; }

  .emblem { animation: fadeIn 1s ease both; }

  .ring-a { transform-box: view-box; transform-origin: 290px 200px; animation: spin 28s linear infinite; }
  .ring-b { transform-box: view-box; transform-origin: 290px 200px; animation: spinRev 20s linear infinite; }
  .orbit  { transform-box: view-box; transform-origin: 290px 200px; animation: spin 9s linear infinite; }

  .gmark  { stroke-dasharray: 280; animation: drawG 1.6s cubic-bezier(.2,.8,.2,1) .25s both; }
  .gpulse { stroke-dasharray: 46 234; opacity: 0; animation: travel 3.4s linear 2.2s infinite; }

  .rise-1 { animation: riseIn .9s cubic-bezier(.2,.8,.2,1) .45s both; }
  .rise-2 { animation: riseIn .9s cubic-bezier(.2,.8,.2,1) .60s both; }
  .rise-3 { animation: riseIn .9s cubic-bezier(.2,.8,.2,1) .75s both; }

  .rule { transform-box: fill-box; transform-origin: left center; animation: growX .85s cubic-bezier(.2,.8,.2,1) 1s both; }

  @media (prefers-reduced-motion: reduce) {
    .blob-a, .blob-b, .blob-c,
    .ring-a, .ring-b, .orbit,
    .gmark, .gpulse,
    .rise-1, .rise-2, .rise-3,
    .rule, .emblem,
    .btn-demo::before, .btn-demo::after { animation: none !important; }
    .gpulse { opacity: 0 !important; }
  }
</style>
</head>

<body>

<div class="page">

  <!-- ================= LOGO ================= -->
  <div class="logo-wrap">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400"
       role="img" aria-labelledby="gsmTitle gsmDesc" text-rendering="geometricPrecision">
    <title id="gsmTitle">GSM Solution</title>
    <desc id="gsmDesc">GSM Solution — custom software development for order management, inventory management, attendance, quotation and GST billing systems.</desc>

    <defs>
      <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0"   stop-color="#05070f"/>
        <stop offset="0.5" stop-color="#0a1024"/>
        <stop offset="1"   stop-color="#04060d"/>
      </linearGradient>

      <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0"    stop-color="#3b82f6"/>
        <stop offset="0.45" stop-color="#22d3ee"/>
        <stop offset="1"    stop-color="#8b5cf6"/>
      </linearGradient>

      <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"    stop-color="#ffffff"/>
        <stop offset="0.65" stop-color="#e2ecff"/>
        <stop offset="1"    stop-color="#9fc0ff"/>
      </linearGradient>

      <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"   stop-color="#22d3ee"/>
        <stop offset="0.5" stop-color="#3b82f6"/>
        <stop offset="1"   stop-color="#8b5cf6" stop-opacity="0"/>
      </linearGradient>

      <radialGradient id="blobBlue">
        <stop offset="0" stop-color="#2563eb" stop-opacity="0.50"/>
        <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="blobCyan">
        <stop offset="0" stop-color="#06b6d4" stop-opacity="0.40"/>
        <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="blobViolet">
        <stop offset="0" stop-color="#7c3aed" stop-opacity="0.42"/>
        <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="coreGlow">
        <stop offset="0"   stop-color="#22d3ee" stop-opacity="0.30"/>
        <stop offset="0.6" stop-color="#3b82f6" stop-opacity="0.08"/>
        <stop offset="1"   stop-color="#3b82f6" stop-opacity="0"/>
      </radialGradient>

      <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
        <path d="M44 0H0v44" fill="none" stroke="#3b5ba9" stroke-width="1"/>
      </pattern>
      <radialGradient id="gridFadeGrad">
        <stop offset="0"   stop-color="#ffffff" stop-opacity="0.50"/>
        <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.10"/>
        <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <mask id="gridMask">
        <rect width="1200" height="400" fill="url(#gridFadeGrad)"/>
      </mask>

      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="5" result="b"/>
        <feMerge>
          <feMergeNode in="b"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge>
          <feMergeNode in="b"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <rect width="1200" height="400" fill="url(#bgGrad)"/>
    <rect width="1200" height="400" fill="url(#grid)" mask="url(#gridMask)" opacity="0.55"/>

    <g class="blob-a"><circle cx="290" cy="200" r="300" fill="url(#blobBlue)"/></g>
    <g class="blob-b"><circle cx="1030" cy="30" r="320" fill="url(#blobViolet)"/></g>
    <g class="blob-c"><circle cx="760" cy="420" r="300" fill="url(#blobCyan)"/></g>

    <g class="emblem">
      <circle cx="290" cy="200" r="130" fill="url(#coreGlow)"/>

      <g class="ring-a">
        <circle cx="290" cy="200" r="96" fill="none"
                stroke="url(#brandGrad)" stroke-width="2"
                stroke-linecap="round" stroke-dasharray="20 30" opacity="0.9"/>
      </g>

      <g class="ring-b">
        <circle cx="290" cy="200" r="79" fill="none"
                stroke="#22d3ee" stroke-width="2"
                stroke-linecap="round" stroke-dasharray="2 13" opacity="0.6"/>
      </g>

      <circle cx="290" cy="200" r="63" fill="#0a1229" fill-opacity="0.88"
              stroke="url(#brandGrad)" stroke-width="1.5" stroke-opacity="0.7"/>

      <path class="gmark"
            d="M 319.57 164.76 A 46 46 0 1 0 322.53 232.53 L 322.53 200 L 296 200"
            fill="none" stroke="url(#brandGrad)" stroke-width="11"
            stroke-linecap="round" stroke-linejoin="round"
            filter="url(#glow)"/>

      <path class="gpulse"
            d="M 319.57 164.76 A 46 46 0 1 0 322.53 232.53 L 322.53 200 L 296 200"
            fill="none" stroke="#a5f3fc" stroke-width="11"
            stroke-linecap="round" stroke-linejoin="round"/>

      <g class="orbit">
        <circle cx="386" cy="200" r="7" fill="#22d3ee" filter="url(#nodeGlow)"/>
        <circle cx="386" cy="200" r="3" fill="#ffffff"/>
      </g>
    </g>

    <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
      <text class="rise-1" x="422" y="178" font-size="106" font-weight="800"
            letter-spacing="1" fill="url(#wordGrad)">GSM</text>

      <text class="rise-2" x="428" y="230" font-size="30" font-weight="600"
            letter-spacing="13" fill="#22d3ee">SOLUTION</text>

      <rect class="rule" x="428" y="258" width="300" height="3" rx="1.5" fill="url(#ruleGrad)"/>

      <text class="rise-3" x="428" y="296" font-size="16" font-weight="500"
            letter-spacing="1.6" fill="#8ea6d4">Order · Inventory · Attendance · Billing · Quotation · GST</text>
    </g>
  </svg>
  </div>

  <!-- ================= REQUEST DEMO BUTTON ================= -->
  <button id="demoBtn" class="btn-demo" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <span>Request Demo</span>
  </button>

</div>

<!-- ================= MODAL ================= -->
<div class="modal-overlay" id="modalOverlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

    <button class="modal-close" id="modalClose" type="button" aria-label="Close dialog">&times;</button>

    <h2 id="modalTitle">Request a Free Demo</h2>
    <p class="sub">
      Tell us what you need and we'll show you a live walkthrough of the right
      GSM Solution software for your business.
    </p>

    <!-- ============================================================

    ============================================================ -->
    <form id="demoForm" novalidate>

      <input type="hidden" name="access_key" value="00b18b52-f17b-4739-8720-309d2cb0d711">
      <input type="hidden" name="subject"    value="New Demo Request — GSM Solution">
      <input type="hidden" name="from_name"  value="GSM Solution Website">

      <div class="field-row">
        <div class="field">
          <label for="name">Full Name <span class="req">*</span></label>
          <input id="name" name="name" type="text" placeholder="John Doe"
                 autocomplete="name" required>

          <label for="email">Email ID <span class="req">*</span></label>
          <input id="email" name="email" type="email" placeholder="you@company.com"

        <div class="field">
          <label for="phone">Contact Number <span class="req">*</span></label>
          <input id="phone" name="phone" type="tel" placeholder="+91 98765 43210"
                 autocomplete="tel" required pattern="[0-9+\-\s()]{7,20}">

                  placeholder="Briefly tell us what you need…"></textarea>

     JAVASCRIPT

<script>
(function () {
  "use strict";

  const overlay   = document.getElementById("modalOverlay");
  const openBtn   = document.getElementById("demoBtn");
  const closeBtn  = document.getElementById("modalClose");
  const form      = document.getElementById("demoForm");
  const statusBox = document.getElementById("formStatus");
  const submitBtn = document.getElementById("submitBtn");
  const category  = document.getElementById("category");
  const otherWrap = document.getElementById("otherWrap");
  const otherText = document.getElementById("otherDetails");

  let lastFocused = null;

  /* ---------- open / close ---------- */
  function openModal() {
    lastFocused = document.activeElement;
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    // Focus first field after animation
    setTimeout(() => document.getElementById("name").focus(), 150);
  }

  function closeModal() {
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    if (lastFocused) lastFocused.focus();
  }

  openBtn.addEventListener("click", openModal);
  closeBtn.addEventListener("click", closeModal);

  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) closeModal();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && overlay.classList.contains("open")) closeModal();
  });

  /* focus trap */
  overlay.addEventListener("keydown", function (e) {
    if (e.key !== "Tab") return;
    const focusables = overlay.querySelectorAll(
      'button, input:not([type="hidden"]), select, textarea, [href], [tabindex]:not([tabindex="-1"])'
    );
    const list = Array.prototype.filter.call(focusables, function (el) {
      return el.offsetParent !== null && !el.disabled;
    });
    if (!list.length) return;

    const first = list[0];
    const last  = list[list.length - 1];

    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  });

  /* ---------- "Other" conditional field ---------- */
  category.addEventListener("change", function () {
    const isOther = category.value === "Other";
    otherWrap.classList.toggle("show", isOther);
    otherText.required = isOther;
    if (isOther) {
      setTimeout(() => otherText.focus(), 120);
    } else {
      otherText.value = "";
    }
  });

  /* ---------- submit ---------- */
  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    // native validation
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    // guard: ensure key is set
    const keyField = form.querySelector('input[name="access_key"]');
    if (!keyField.value || keyField.value.length < 10) {
      statusBox.className = "form-status error";
      statusBox.textContent =
        "⚠️ Setup incomplete: the Web3Forms access key is missing or invalid.";
      return;
    }

    // loading state
    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";
    statusBox.className = "form-status";
    statusBox.textContent = "";

    try {
      const response = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { Accept: "application/json" },
        body: new FormData(form)
      });

      const data = await response.json();

      if (response.ok && data.success) {
        form.reset();
        otherWrap.classList.remove("show");
        otherText.required = false;

        statusBox.className = "form-status success";
        statusBox.textContent =
          "✅ Thank you! Your demo request has been sent. We'll contact you within 24 hours.";

        // auto-close after 4s
        setTimeout(closeModal, 4000);
      } else {
        throw new Error(data.message || "Submission failed.");
      }
    } catch (err) {
      statusBox.className = "form-status error";
      statusBox.textContent =
        "❌ " + (err.message || "Something went wrong.") +
        " Please try again, or email us directly at gsmmargao@gmail.com.";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = originalText;
    }
  });
})();
</script>
