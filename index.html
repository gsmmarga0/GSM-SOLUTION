<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GSM Solution — Animated Logo</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #03050c;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .logo-wrap {
    width: min(1200px, 96vw);
  }
  .logo-wrap svg {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>

<div class="logo-wrap">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400"
     role="img" aria-labelledby="gsmTitle gsmDesc" text-rendering="geometricPrecision">
  <title id="gsmTitle">GSM Solution</title>
  <desc id="gsmDesc">GSM Solution — custom software development for order management, inventory management, attendance, quotation and GST billing systems.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#05070f"/>
      <stop offset="0.5" stop-color="#0a1024"/>
      <stop offset="1"   stop-color="#04060d"/>
    </linearGradient>

    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#3b82f6"/>
      <stop offset="0.45" stop-color="#22d3ee"/>
      <stop offset="1"    stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#e2ecff"/>
      <stop offset="1"    stop-color="#9fc0ff"/>
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1"   stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="blobBlue">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobViolet">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow">
      <stop offset="0"   stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="1"   stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#3b5ba9" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFadeGrad">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="400" fill="url(#gridFadeGrad)"/>
    </mask>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* ---------- core motion ---------- */
    @keyframes spin      { to { transform: rotate(360deg); } }
    @keyframes spinRev   { to { transform: rotate(-360deg); } }

    @keyframes fadeIn    { from { opacity: 0; } to { opacity: 1; } }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes drawG {
      from { stroke-dashoffset: 280; }
      to   { stroke-dashoffset: 0; }
    }

    @keyframes travel {
      0%   { stroke-dashoffset: 280; opacity: 0; }
      8%   { opacity: 0.95; }
      88%  { opacity: 0.95; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    @keyframes growX {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(34px, -26px); }
    }
    @keyframes drift2 {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(-40px, 22px); }
    }
    @keyframes drift3 {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(26px, 30px); }
    }

    /* ---------- background ambience ---------- */
    .blob-a { animation: drift  22s ease-in-out infinite; }
    .blob-b { animation: drift2 28s ease-in-out infinite; }
    .blob-c { animation: drift3 25s ease-in-out infinite; }

    /* ---------- emblem ---------- */
    .emblem { animation: fadeIn 1s ease both; }

    .ring-a {
      transform-box: view-box;
      transform-origin: 290px 200px;
      animation: spin 28s linear infinite;
    }
    .ring-b {
      transform-box: view-box;
      transform-origin: 290px 200px;
      animation: spinRev 20s linear infinite;
    }
    .orbit {
      transform-box: view-box;
      transform-origin: 290px 200px;
      animation: spin 9s linear infinite;
    }

    .gmark {
      stroke-dasharray: 280;
      animation: drawG 1.6s cubic-bezier(.2,.8,.2,1) .25s both;
    }
    .gpulse {
      stroke-dasharray: 46 234;
      opacity: 0;
      animation: travel 3.4s linear 2.2s infinite;
    }

    /* ---------- wordmark ---------- */
    .rise-1 { animation: riseIn .9s cubic-bezier(.2,.8,.2,1) .45s both; }
    .rise-2 { animation: riseIn .9s cubic-bezier(.2,.8,.2,1) .60s both; }
    .rise-3 { animation: riseIn .9s cubic-bezier(.2,.8,.2,1) .75s both; }

    .rule {
      transform-box: fill-box;
      transform-origin: left center;
      animation: growX .85s cubic-bezier(.2,.8,.2,1) 1s both;
    }

    /* ---------- accessibility ---------- */
    @media (prefers-reduced-motion: reduce) {
      .blob-a, .blob-b, .blob-c,
      .ring-a, .ring-b, .orbit,
      .gmark, .gpulse,
      .rise-1, .rise-2, .rise-3,
      .rule, .emblem {
        animation: none !important;
      }
      .gpulse { opacity: 0 !important; }
    }
  </style>

  <!-- ================= BACKGROUND ================= -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)" mask="url(#gridMask)" opacity="0.55"/>

  <g class="blob-a"><circle cx="290" cy="200" r="300" fill="url(#blobBlue)"/></g>
  <g class="blob-b"><circle cx="1030" cy="30" r="320" fill="url(#blobViolet)"/></g>
  <g class="blob-c"><circle cx="760" cy="420" r="300" fill="url(#blobCyan)"/></g>

  <!-- ================= EMBLEM ================= -->
  <g class="emblem">
    <!-- soft core halo -->
    <circle cx="290" cy="200" r="130" fill="url(#coreGlow)"/>

    <!-- outer rotating dashed ring -->
    <g class="ring-a">
      <circle cx="290" cy="200" r="96" fill="none"
              stroke="url(#brandGrad)" stroke-width="2"
              stroke-linecap="round" stroke-dasharray="20 30" opacity="0.9"/>
    </g>

    <!-- inner counter-rotating dotted ring -->
    <g class="ring-b">
      <circle cx="290" cy="200" r="79" fill="none"
              stroke="#22d3ee" stroke-width="2"
              stroke-linecap="round" stroke-dasharray="2 13" opacity="0.6"/>
    </g>

    <!-- glass disc -->
    <circle cx="290" cy="200" r="63" fill="#0a1229" fill-opacity="0.88"
            stroke="url(#brandGrad)" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- G monogram (draws itself in) -->
    <path class="gmark"
          d="M 319.57 164.76 A 46 46 0 1 0 322.53 232.53 L 322.53 200 L 296 200"
          fill="none" stroke="url(#brandGrad)" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- travelling light pulse along the G -->
    <path class="gpulse"
          d="M 319.57 164.76 A 46 46 0 1 0 322.53 232.53 L 322.53 200 L 296 200"
          fill="none" stroke="#a5f3fc" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- orbiting node -->
    <g class="orbit">
      <circle cx="386" cy="200" r="7" fill="#22d3ee" filter="url(#nodeGlow)"/>
      <circle cx="386" cy="200" r="3" fill="#ffffff"/>
    </g>
  </g>

  <!-- ================= WORDMARK ================= -->
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">

    <!-- GSM -->
    <text class="rise-1" x="422" y="178"
          font-size="106" font-weight="800" letter-spacing="1"
          fill="url(#wordGrad)">GSM</text>

    <!-- SOLUTION -->
    <text class="rise-2" x="428" y="230"
          font-size="30" font-weight="600" letter-spacing="13"
          fill="#22d3ee">SOLUTION</text>

    <!-- animated divider -->
    <rect class="rule" x="428" y="258" width="300" height="3" rx="1.5"
          fill="url(#ruleGrad)"/>

    <!-- tagline -->
    <text class="rise-3" x="428" y="296"
          font-size="16" font-weight="500" letter-spacing="1.6"
          fill="#8ea6d4">Order · Inventory · Attendance · Billing · Quotation · GST</text>
  </g>
</svg>
</div>

</body>
</html>
